name: privet
description: Privet messenger — Android, Web, Windows, Linux
publish_to: 'none'
version: 0.1.17+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  http_parser: ^4.1.2
  web_socket_channel: ^3.0.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^8.3.7
  emoji_picker_flutter: ^4.3.0
  flutter_webrtc: ^0.12.12
  record: ^6.0.0
  audioplayers: ^6.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  # Bundles libmdk/FFmpeg so video_player works natively on Linux & Windows
  # (official video_player only supports Android/iOS/macOS/web).
  fvp: ^0.37.3
  animated_emoji: ^3.2.1
  web: ^1.1.1
  package_info_plus: ^9.0.1
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  desktop_notifications: ^0.6.3
  dbus: ^0.7.11
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Message tone: embedded as data URI on web; WAV twin on native.
  # Incoming ringtone: MP3 on web, WAV on native. Outgoing: random classical MP3s.
  assets:
    - assets/sounds/message-notification.mp3
    - assets/sounds/message-notification.wav
    - assets/sounds/incoming_call.mp3
    - assets/sounds/incoming_call.wav
    - assets/sounds/outgoing/
    - assets/dictionaries/en_words.txt
    - assets/icons/tray.png
    - assets/icons/tray.ico
    - assets/icons/tray-unread.png
    - assets/icons/tray-unread.ico
    # google_fonts matches assets by API filename prefix, e.g.
    # assets/google_fonts/DMSans-Regular.ttf (not the cache hash form).
    # Bundling these lets us disable runtime fetching (big Linux desktop
    # win: no per-font HTTP / path_provider I/O on hot paint paths).
    - assets/google_fonts/
