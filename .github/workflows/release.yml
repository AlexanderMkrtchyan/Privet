# Build and publish desktop release artifacts on tag push (v*).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0). Leave empty to use pubspec only for artifact names."
        required: false
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev \
            python3-pil fakeroot dpkg-dev rsync

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get + analyze
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter analyze --no-fatal-infos || true
          flutter test || true

      - name: Build Linux packages
        env:
          PRIVET_BUILD: ${{ github.ref_name }}-${{ github.run_number }}
          PRIVET_INSTALL_DIR: ${{ runner.temp }}/privet-install
        run: |
          chmod +x scripts/build-linux.sh
          # Skip local menu install noise on CI — still builds tarball + deb
          ./scripts/build-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            server/public/downloads/privet-linux-x64.tar.gz
            server/public/downloads/privet-linux-amd64.deb
            server/public/downloads/privet_*_amd64.deb
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Prefetch fvp MDK SDK (Windows)
        shell: pwsh
        run: |
          $pubCache = Join-Path $env:LOCALAPPDATA "Pub\Cache"
          if (-not (Test-Path $pubCache)) { $pubCache = Join-Path $env:USERPROFILE "AppData\Local\Pub\Cache" }
          $fvpDir = Get-ChildItem (Join-Path $pubCache "hosted\pub.dev") -Directory -Filter "fvp-*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fvpDir) { Write-Host "fvp not found in pub cache"; exit 0 }
          $winDir = Join-Path $fvpDir.FullName "windows"
          $sdkCheck = Join-Path $winDir "mdk-sdk\lib\cmake\FindMDK.cmake"
          if (Test-Path $sdkCheck) { Write-Host "MDK SDK already present"; exit 0 }
          $archive = Join-Path $winDir "mdk-sdk-windows-x64.7z"
          Write-Host "Downloading MDK SDK from SourceForge..."
          curl.exe -sSL --retry 4 --connect-timeout 30 -o $archive "https://sourceforge.net/projects/mdk-sdk/files/nightly/mdk-sdk-windows-x64.7z/download"
          if (-not (Test-Path $archive)) { Write-Host "download failed (will retry via CMake)"; exit 0 }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip x -y "-o$winDir" $archive | Out-Null
          } else {
            tar -xf $archive -C $winDir
          }
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Write-Host "MDK SDK ready: $(Test-Path $sdkCheck)"

      - name: Build Windows release
        working-directory: app
        shell: bash
        env:
          PRIVET_BUILD: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          set -o pipefail
          flutter build windows --release --dart-define=PRIVET_BUILD="$PRIVET_BUILD" 2>&1 | tee "$RUNNER_TEMP/wbuild.log"

      # Diagnostics: on failure, mirror the build log tail as annotations so the
      # real error is visible in the public check-run annotations (log archives
      # require repo-admin rights). GitHub keeps only the first ~10 annotations,
      # so emit the final lines (where the error summary lives) plus any lines
      # that look like errors anywhere in the log.
      - name: Surface Windows build error
        if: failure()
        shell: bash
        run: |
          echo "::group::Windows build error tail"
          {
            tail -n 30 "$RUNNER_TEMP/wbuild.log" 2>/dev/null | grep -iE "error|fatal|exception|failed|cmake error|FAILED|Cannot|not found" | tail -n 8
            tail -n 5 "$RUNNER_TEMP/wbuild.log" 2>/dev/null
          } | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::error::$line"; fi
          done
          echo "::endgroup::"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 3

      - name: Read version from pubspec
        id: ver
        shell: bash
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/public/downloads | Out-Null
          $release = "app/build/windows/x64/runner/Release"
          if ((Test-Path "$release/Privet.exe") -and -not (Test-Path "$release/privet.exe")) {
            Copy-Item "$release/Privet.exe" "$release/privet.exe" -Force
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          $root = (Get-Location).Path
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$root\$($release -replace '/','\')" `
            "/DOutputDir=$root\server\public\downloads" `
            "/DMyAppIcon=$root\app\windows\runner\resources\app_icon.ico" `
            "$root\packaging\windows\privet.iss"
          Copy-Item "server/public/downloads/Privet-Setup-${{ steps.ver.outputs.version }}.exe" `
            "server/public/downloads/Privet-Setup.exe" -Force
          bash scripts/write-version-json.sh
          Get-ChildItem server/public/downloads | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            server/public/downloads/Privet-Setup.exe
            server/public/downloads/Privet-Setup-*.exe
            server/public/version.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # Publish as long as Windows built; Linux is best-effort (runner-specific
    # packaging can fail, and Linux packages are also shipped from the web host).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'version.json' \) -print
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'version.json' \) -exec cp -n {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Privet desktop release

            - **Linux:** `.deb` (Ubuntu/Debian) and `.tar.gz`
            - **Windows:** native Flutter installer (`Privet-Setup.exe`) — unsigned; SmartScreen may warn (More info → Run anyway). Installed apps can update from Profile → **Update available**.

            Default API: `https://messenger.banderdog.com`

            ### Install
            - Ubuntu: `sudo apt install ./privet-linux-amd64.deb`
            - Windows: run `Privet-Setup.exe`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
