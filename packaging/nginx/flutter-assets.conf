# Serve the Flutter web bundle directly from disk.
# Same bug as /downloads/: proxying large files through Node with
# Connection: "upgrade" on location / aborts the body after ~70KB
# (HTTP/2 INTERNAL_ERROR / "transfer closed with N bytes remaining").
# That leaves /app/ stuck on the boot spinner because main.dart.js
# (~7MB) and canvaskit.wasm never finish.
#
# Install on the production host (Hestia):
#   /home/alex/conf/web/messanger.banderdog.com/nginx.ssl.conf_flutter
# then: nginx -t && systemctl reload nginx
#
# Also install packaging/nginx/ws-map.conf into /etc/nginx/conf.d/ and
# change location / to: proxy_set_header Connection $connection_upgrade;
# so /media/ and other Node-proxied bodies are not truncated.

location = /main.dart.js {
    alias /home/alex/privet/server/public/main.dart.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    sendfile on;
    tcp_nopush on;
    send_timeout 120s;
}

location = /flutter.js {
    alias /home/alex/privet/server/public/flutter.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /flutter_bootstrap.js {
    alias /home/alex/privet/server/public/flutter_bootstrap.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /canvaskit/ {
    alias /home/alex/privet/server/public/canvaskit/;
    sendfile on;
    tcp_nopush on;
    send_timeout 120s;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types {
        application/javascript js;
        application/wasm wasm;
    }
}

location ^~ /assets/ {
    alias /home/alex/privet/server/public/assets/;
    sendfile on;
    tcp_nopush on;
    send_timeout 120s;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
