# nginx default client_max_body_size is 1m — that rejects chat uploads
# (a 2.7MB photo/video returns 413 before Node sees the request).
# Install as a server-level include (Hestia):
#   /home/alex/conf/web/messanger.banderdog.com/nginx.ssl.conf_upload_size
# then: nginx -t && systemctl reload nginx
client_max_body_size 512m;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
