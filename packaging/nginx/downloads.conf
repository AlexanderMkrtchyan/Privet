# Serve installers/static downloads directly from disk.
# Proxying large files through Node with Connection: "upgrade" on location /
# aborts the body after ~70KB ("connection closed" / HTTP2 INTERNAL_ERROR).
# That broke Windows in-app update and the Flutter web bundle (see flutter-assets.conf).
#
# Install on the production host (Hestia):
#   /home/alex/conf/web/messanger.banderdog.com/nginx.ssl.conf_downloads
# then: nginx -t && systemctl reload nginx
location ^~ /downloads/ {
    alias /home/alex/privet/server/public/downloads/;
    default_type application/octet-stream;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=60" always;
    sendfile on;
    tcp_nopush on;
    send_timeout 600s;
}

# Tiny updater metadata — also static so it never depends on Node for updates.
location = /version.json {
    alias /home/alex/privet/server/public/version.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
}
