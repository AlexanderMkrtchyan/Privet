# Serve chat uploads directly from disk.
# Proxying /media/ through Node is slow (max-age=0, extra hop) and the same
# Connection: upgrade bug that truncated /downloads/ can stall large videos.
# Byte-range + sendfile lets the player start after the first chunk.
#
# Install on the production host (Hestia):
#   /home/alex/conf/web/messanger.banderdog.com/nginx.ssl.conf_media
# then: nginx -t && systemctl reload nginx
location ^~ /media/ {
    alias /home/alex/privet/server/data/uploads/;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    sendfile on;
    tcp_nopush on;
    send_timeout 600s;
    types {
        video/mp4 mp4 m4v;
        video/webm webm;
        video/quicktime mov;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/gif gif;
        audio/mpeg mp3;
        audio/mp4 m4a;
        audio/wav wav;
        audio/webm weba;
        application/octet-stream bin;
    }
}
