# http-context map for WebSocket upgrades.
# Install as /etc/nginx/conf.d/privet-ws-map.conf (Hestia includes conf.d/*.conf).
# Then in the messenger location / block:
#   proxy_set_header Upgrade $http_upgrade;
#   proxy_set_header Connection $connection_upgrade;
#
# Unconditional Connection: "upgrade" makes nginx abort large proxied
# responses after ~70KB (Flutter JS, canvaskit.wasm, media, Windows .exe).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
